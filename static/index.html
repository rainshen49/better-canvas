<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Better Canvas</title>
    <!-- The sail icon, embedded here so the page needs no extra files -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4f91'/%3E%3Cpath d='M16.5 4.5C22 9.5 25 15.5 25.5 21.5H16.5Z' fill='%23fff'/%3E%3Cpath d='M14.5 8.5V21.5H7.5C9 16.5 11.5 12 14.5 8.5Z' fill='%23fff' fill-opacity='.72'/%3E%3Cpath d='M5.5 23.5H26.5L23.5 27H8.5Z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>
          <svg class="logo" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1d4f91"/><path d="M16.5 4.5C22 9.5 25 15.5 25.5 21.5H16.5Z" fill="#fff"/><path d="M14.5 8.5V21.5H7.5C9 16.5 11.5 12 14.5 8.5Z" fill="#fff" fill-opacity=".72"/><path d="M5.5 23.5H26.5L23.5 27H8.5Z" fill="#fff"/></svg>
          Better Canvas
        </h1>
        <div class="sub" id="sub">Loading…</div>
      </div>
      <nav>
        <button id="tab-due" class="on">Due soon</button>
        <button id="tab-mat">Slides &amp; readings</button>
      </nav>
      <button class="btn" id="signout" title="Forget your token in this browser">Log out</button>
    </header>

    <main>
      <!-- One box at the top. While loading it shows progress. Once everything
           has loaded it shows the callout asking for reading due dates on "Due soon"
           and ✓ on "Slides & readings". If loading failed, it shows ✕ on both tabs.
           The two are stacked in the same spot, so the box doesn't change size when they swap. -->
      <div id="topslot" class="topslot hidden">
        <div id="loadbar" class="loadbar" role="status" aria-live="polite">
          <span class="ok" id="loadicon">✓</span>
          <span id="loadtxt">Connecting to CourseWorks…</span>
          <div class="prog"><i id="progfill"></i></div>
        </div>
        <div id="readnote" class="note" role="note">
          <span>🤝 Help out your classmates by adding due dates for readings</span>
          <button type="button" class="jump-undated">Add due dates ↓</button>
        </div>
      </div>

      <div id="err"></div>

      <!-- Login screen: shown when no token is saved, after logging out, or when CourseWorks rejects the token -->
      <section id="auth" class="hidden">
        <form class="authcard" id="authform" autocomplete="off">
          <h2>Log in with CourseWorks</h2>
          <p class="sub">You'll stay logged in on this browser.</p>
          <ol class="steps">
            <li>
              Open
              <a href="https://courseworks2.columbia.edu/profile/settings" target="_blank" rel="noopener">CourseWorks settings</a>.
            </li>
            <li>Click <b>+ New Access Token</b>, enter any name, then <b>Generate Token</b>.</li>
            <li>Copy the token.</li>
          </ol>
          <input id="tokeninput" type="password" placeholder="Paste your access token" aria-label="Access token" spellcheck="false" required />
          <div id="autherr"></div>
          <button class="btn primary" type="submit">Log in</button>
        </form>
      </section>

      <!-- "Due soon" tab (filled in by app.js) -->
      <section id="due">
        <!-- Everything due in the next few days, by day -->
        <div id="due-list"></div>
        <!-- Readings nobody has given a due date yet, by course -->
        <div id="undated"></div>
      </section>

      <!-- "Slides & readings" tab -->
      <section id="mat" class="hidden">
        <div class="tools">
          <input id="q" placeholder="Search slides and readings" />
          <button class="chip on" data-f="all">All</button>
          <button class="chip" data-f="slides">📊 Slides</button>
          <button class="chip" data-f="reading">📄 Readings</button>
          <button class="chip" data-f="video">🎬 Recordings</button>
          <button class="chip" data-f="other">🔗 Other</button>
          <button class="chip" id="toggleAll">Expand all</button>
        </div>
        <!-- One card per course (filled in by app.js) -->
        <div id="courses"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
